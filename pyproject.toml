[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scp-kes-documentsynthese"
version = "0.1.0"
description = "LLM-pipeline voor paper-voor-paper extractie en synthese van literatuur over klimaat- en energierechtvaardigheid."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=3.8.0,<4",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
